services:
  postgres:
    image: postgres:16-alpine
    container_name: haven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haven_dev
    ports:
      - "5432:5432"
    volumes:
      - haven-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haven_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  haven-postgres-data:
